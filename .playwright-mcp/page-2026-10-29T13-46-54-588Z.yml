      - generic [ref=f5e535]:
        - 'heading "6. Sostituzioni: come variare una progressione" [level=2] [ref=f5e536]'
        - paragraph [ref=f5e537]: "Nella pagina di ogni progressione trovi le sostituzioni già calcolate. Ecco cosa significano:"
        - generic [ref=f5e538]:
          - term [ref=f5e539]: Sostituzione diatonica
          - definition [ref=f5e540]: Sostituisci un accordo con un altro della stessa tonalità che ha 2 note in comune (I ↔ vi ↔ iii, IV ↔ ii, V ↔ vii°). Cambia il colore, non la direzione.
          - term [ref=f5e541]: Colore / estensione
          - definition [ref=f5e542]: Aggiungi note all'accordo (7, 9, sus, 6) senza cambiarne la funzione. Il modo più semplice per "modernizzare" una progressione.
          - term [ref=f5e543]: Prestito modale
          - definition [ref=f5e544]: "Prendi l'accordo dalla tonalità parallela (Do maggiore ↔ Do minore): iv, ♭VI, ♭VII in maggiore; IV, V in minore. Emozione immediata."
          - term [ref=f5e545]: Dominante secondaria
          - definition [ref=f5e546]: Ogni accordo può avere la sua "dominante" (V7/x). Mettila prima per far sembrare quell'accordo una piccola tonica.
          - term [ref=f5e547]: Sostituzione di tritono
          - definition [ref=f5e548]: "Una dominante può essere sostituita da quella a distanza di tritono (Sol7 → Re♭7): stesse note di tensione, basso cromatico."
          - term [ref=f5e549]: ii–V di avvicinamento
          - definition [ref=f5e550]: "Fai precedere un accordo dal suo ii–V: il motore del jazz, utile anche nel pop per i cambi di tonalità."
          - term [ref=f5e551]: Diminuito di passaggio
          - definition [ref=f5e552]: Un accordo diminuito di passaggio collega due accordi a distanza di tono con un basso cromatico (I – ♯i°7 – ii).
          - term [ref=f5e553]: Sospensione
          - definition [ref=f5e554]: "Suona prima la versione sospesa (sus4) e poi risolvi: tensione e rilascio sullo stesso accordo."
          - term [ref=f5e555]: Inversione (basso)
          - definition [ref=f5e556]: "Metti al basso la terza o la quinta (slash chord, es. Do/Mi): la linea di basso diventa melodica e fluida."
          - term [ref=f5e557]: Power chord
          - definition [ref=f5e558]: "Solo fondamentale e quinta: neutro tra maggiore e minore, perfetto con la distorsione."
          - term [ref=f5e559]: Backdoor
          - definition [ref=f5e560]: "Arrivare alla tonica da iv7 – ♭VII7 invece che da V7: un ritorno a casa caldo e nostalgico."
          - term [ref=f5e561]: Napoletana
          - definition [ref=f5e562]: "Il ♭II maggiore prima della dominante: colore struggente da opera e da metal neoclassico."
          - term [ref=f5e563]: Cadenza d'inganno
          - definition [ref=f5e564]: "Dopo la dominante, al posto della tonica arriva vi (o ♭VI in minore): la frase resta aperta."
          - term [ref=f5e565]: Pedale
          - definition [ref=f5e566]: "Il basso resta fermo sulla tonica mentre sopra cambiano gli accordi: tensione sospesa."
      - generic [ref=f5e567]:
        - heading "7. Sulla chitarra" [level=2] [ref=f5e568]
        - list [ref=f5e569]:
          - listitem [ref=f5e570]:
            - strong [ref=f5e571]: Accordi aperti
            - text: ": usano corde a vuoto, suonano pieni. Con il capotasto puoi usarli in ogni tonalità."
          - listitem [ref=f5e572]:
            - strong [ref=f5e573]: Sistema CAGED
            - text: ": le forme aperte di Do, La, Sol, Mi, Re diventano mobili con il barré. In questa app trovi soprattutto la forma di Mi (fondamentale sulla 6ª corda) e di La (fondamentale sulla 5ª)."
          - listitem [ref=f5e574]:
            - strong [ref=f5e575]: Restare in zona
            - text: ": la scelta delle forme minimizza i salti della mano. Spesso conviene alternare forme di Mi e di La nello stesso punto del manico invece di spostare un unico barré."
          - listitem [ref=f5e576]:
            - strong [ref=f5e577]: Power chord
            - text: ": fondamentale + quinta (+ ottava). Due o tre dita, perfetti con la distorsione."
          - listitem [ref=f5e578]:
            - strong [ref=f5e579]: Shell jazz
            - text: ": fondamentale, terza e settima su tre corde: leggeri e chiari, il modo jazz di suonare le settime."
          - listitem [ref=f5e580]:
            - text: "Nei diagrammi: i numeri sono le dita (1 indice, 2 medio, 3 anulare, 4 mignolo),"
            - strong [ref=f5e581]: ×
            - text: corda muta,
            - strong [ref=f5e582]: ○
            - text: corda a vuoto; il colore pieno indica la fondamentale.
      - generic [ref=f5e583]:
        - heading "8. Glossario" [level=2] [ref=f5e584]
        - generic [ref=f5e585]:
          - term [ref=f5e586]: Tonalità
          - definition [ref=f5e587]: L'insieme di note e accordi attorno a una nota "casa" (la tonica).
          - term [ref=f5e588]: Triade
          - definition [ref=f5e589]: "Accordo di tre note: fondamentale, terza, quinta."
          - term [ref=f5e590]: Settima
          - definition [ref=f5e591]: "Quarta nota aggiunta sopra la triade: rende l'accordo più ricco (maj7, 7, m7)."
          - term [ref=f5e592]: Sensibile
          - definition [ref=f5e593]: "Il 7° grado della scala maggiore, a un semitono dalla tonica: crea la spinta della dominante."
          - term [ref=f5e594]: Relativo
          - definition [ref=f5e595]: Maggiore e minore con le stesse note (Do maggiore ↔ La minore).
          - term [ref=f5e596]: Parallelo
          - definition [ref=f5e597]: "Maggiore e minore con la stessa tonica (Do maggiore ↔ Do minore): la fonte dei prestiti."
          - term [ref=f5e598]: Slash chord
          - definition [ref=f5e599]: "Accordo con una nota diversa al basso: Sol/Si = Sol con Si al basso."
          - term [ref=f5e600]: Voicing
          - definition [ref=f5e601]: Il modo in cui le note di un accordo sono disposte sulle corde.
          - term [ref=f5e602]: Turnaround
          - definition [ref=f5e603]: Breve giro di accordi che riporta all'inizio della sezione.
          - term [ref=f5e604]: Vamp
          - definition [ref=f5e605]: Due o tre accordi ripetuti a lungo, spesso come base per improvvisare.
        - paragraph [ref=f5e606]:
          - text: Pronto?
          - link "Torna a comporre →" [ref=f5e607] [cursor=pointer]:
