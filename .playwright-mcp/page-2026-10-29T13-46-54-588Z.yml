      - generic [ref=f5e370]:
        - heading "2. I numeri romani" [level=2] [ref=f5e371]
        - paragraph [ref=f5e372]: "Invece di \"Do – Sol – Lam – Fa\" scriviamo I – V – vi – IV: il numero dice su quale grado della scala è costruito l'accordo. Così la stessa progressione vale in tutte le tonalità."
        - list [ref=f5e373]:
          - listitem [ref=f5e374]:
            - strong [ref=f5e375]: Maiuscolo
            - text: = accordo maggiore (I, IV, V).
            - strong [ref=f5e376]: minuscolo
            - text: = minore (ii, iii, vi).
          - listitem [ref=f5e377]:
            - strong [ref=f5e378]: °
            - text: = diminuito (vii°),
            - strong [ref=f5e379]: ø7
            - text: = semidiminuito,
            - strong [ref=f5e380]: +
            - text: = aumentato.
          - listitem [ref=f5e381]:
            - strong [ref=f5e382]: ♭ e ♯
            - text: "davanti al numero indicano accordi fuori dalla scala maggiore: ♭VII in Do è Si♭."
          - listitem [ref=f5e383]: "In questa app i numeri sono sempre riferiti alla scala maggiore della tonica: la progressione minore epica si scrive i – ♭VI – ♭III – ♭VII."
          - listitem [ref=f5e384]:
            - strong [ref=f5e385]: V7/vi
            - text: "= \"dominante del vi\": l'accordo di settima che porta al vi."
          - listitem [ref=f5e386]:
            - strong [ref=f5e387]: I/3
            - text: "= accordo di I con la terza al basso (in Do: Do/Mi)."
      - generic [ref=f5e388]:
        - 'heading "3. Le funzioni: casa, viaggio, tensione" [level=2] [ref=f5e389]'
        - paragraph [ref=f5e390]: "Ogni accordo ha un \"ruolo\". Capire i ruoli è capire l'armonia:"
        - generic [ref=f5e391]:
          - generic [ref=f5e392]:
            - heading "T — Tonica" [level=3] [ref=f5e393]
            - paragraph [ref=f5e394]: Casa, riposo. I, vi, iii in maggiore; i, ♭III in minore. Finire qui dà senso di conclusione.
          - generic [ref=f5e395]:
            - heading "S — Sottodominante" [level=3] [ref=f5e396]
            - paragraph [ref=f5e397]: Ci si allontana da casa. IV, ii (e in prestito iv, ♭VI, ♭VII). Prepara la tensione.
          - generic [ref=f5e398]:
            - heading "D — Dominante" [level=3] [ref=f5e399]
            - paragraph [ref=f5e400]: "Tensione che chiede di tornare: V, V7, vii°. Contiene la sensibile, la nota che \"vuole\" salire alla tonica."
        - paragraph [ref=f5e401]: La frase tipica è T → S → D → T. Le progressioni pop spesso la "ruotano" o la interrompono per creare emozione (es. V → vi, la cadenza d'inganno).
